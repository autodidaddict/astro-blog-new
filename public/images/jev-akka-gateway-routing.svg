<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372" role="img" aria-label="In the application service, an agent asks a judgment through the Akka SDK, and the Akka Runtime judgment client sends the state and questions to the AI Router in the Akka AI Gateway. The router forwards every request to a backend, consulting the Decision Engine, which chooses the backend by static policy, semantic embedding or SystemOne. The backend sends the judgment request either to the SystemOne API in Optimize on Akka infrastructure, which runs the Jev model, or to the SystemOne API hosted by TypeSafe.">
<defs>
  <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b5721f"/></marker>
  <marker id="slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5f7079"/></marker>
</defs>
